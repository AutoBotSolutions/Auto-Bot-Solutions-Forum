name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Verify site structure
        run: |
          echo "Checking site structure..."
          ls -la site/
          echo "Checking wiki files..."
          ls -la site/wiki/
          echo "Checking CSS files..."
          ls -la site/*.css
          echo "Site structure verified!"

      - name: Validate HTML files
        run: |
          echo "Validating HTML files..."
          find site/ -name "*.html" -type f | while read file; do
            echo "Validating $file..."
            # Basic HTML validation
            if grep -q "<!DOCTYPE html>" "$file"; then
              echo "✓ $file has proper DOCTYPE"
            else
              echo "✗ $file missing DOCTYPE"
              exit 1
            fi
          done
          echo "HTML validation complete!"

      - name: Check CSS and assets
        run: |
          echo "Checking CSS files..."
          if [ -f "site/style.css" ]; then
            echo "✓ Main CSS file exists"
            echo "CSS file size: $(wc -l < site/style.css) lines"
          else
            echo "✗ Main CSS file missing"
            exit 1
          fi
          
          echo "Checking wiki HTML files..."
          wiki_count=$(find site/wiki/ -name "*.html" -type f | wc -l)
          echo "Found $wiki_count wiki HTML files"
          if [ "$wiki_count" -lt "30" ]; then
            echo "✗ Expected at least 30 wiki files, found $wiki_count"
            exit 1
          else
            echo "✓ Wiki files count OK"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        run: |
          echo "🚀 Deployment completed successfully!"
          echo "📁 Site deployed from: /site directory"
          echo "🌐 Live at: ${{ steps.deployment.outputs.page_url }}"
          echo "📊 Includes:"
          echo "  - Main site (index.html)"
          echo "  - CSS styling (style.css)"
          echo "  - JavaScript (script.js)"
          echo "  - Wiki documentation (37 HTML pages)"
          echo "  - All assets and images"
