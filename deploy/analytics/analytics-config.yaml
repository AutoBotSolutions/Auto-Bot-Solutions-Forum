# Analytics Infrastructure Configuration
# Auto Bot Solutions Forum

version: "1.0"
environment: "production"

# Analytics Infrastructure Settings
analytics:
  enabled: true
  name: "forum_analytics"
  description: "Analytics infrastructure for Auto Bot Solutions Forum"
  
  # Database Configuration
  database:
    host: "localhost"
    port: 5432
    database: "forum_analytics"
    username: "analytics_user"
    password: "analytics_password"
    pool_size: 20
    max_overflow: 30
    pool_timeout: 30
    pool_recycle: 3600
    ssl_mode: "prefer"
    
  # Redis Configuration
  redis:
    host: "localhost"
    port: 6379
    db: 0
    password: null
    max_connections: 20
    socket_timeout: 30
    socket_connect_timeout: 30
    max_memory: "2gb"
    
  # Processing Configuration
  processing:
    batch_size: 1000
    timeout: 300
    retry_count: 3
    retry_delay: 60
    parallel_workers: 4
    max_memory_per_worker: "512MB"
    
  # Performance Configuration
  performance:
    query_timeout: 30
    connection_timeout: 10
    cache_ttl: 3600
    index_optimization: true
    statistics_update_interval: 3600
    
  # Monitoring Configuration
  monitoring:
    enabled: true
    metrics_port: 8080
    health_check_interval: 30
    log_level: "INFO"
    log_retention_days: 30
    
  # Security Configuration
  security:
    encryption_enabled: true
    ssl_enabled: true
    authentication_enabled: true
    audit_logging: true

# Data Pipeline Configuration
pipelines:
  # User Activity Pipeline
  user_activity:
    enabled: true
    name: "User Activity Analytics"
    type: "streaming"
    schedule: "*/5 * * * *"  # Every 5 minutes
    source: "forum_production"
    target: "forum_analytics"
    
    source_config:
      query: |
        SELECT 
          u.id as user_id,
          u.username,
          u.email,
          u.last_login,
          u.created_at,
          COUNT(f.id) as forum_posts,
          COUNT(fc.id) as forum_comments,
          COUNT(v.id) as votes_cast,
          COUNT(pv.id) as votes_received,
          MAX(l.timestamp) as last_activity
        FROM users u
        LEFT JOIN forum_posts f ON u.id = f.author_id
        LEFT JOIN forum_comments fc ON u.id = fc.author_id
        LEFT JOIN votes v ON u.id = v.user_id
        LEFT JOIN post_votes pv ON f.id = pv.post_id
        LEFT JOIN login_logs l ON u.id = l.user_id
        WHERE u.updated_at > :last_run_time
        GROUP BY u.id, u.username, u.email, u.last_login, u.created_at
        ORDER BY u.updated_at DESC
      incremental_column: "updated_at"
      batch_size: 1000
    
    transformations:
      - name: "calculate_engagement_score"
        type: "python"
        function: "calculate_user_engagement"
        config:
          post_weight: 3
          comment_weight: 2
          vote_weight: 1
          login_weight: 0.5
      
      - name: "determine_activity_level"
        type: "python"
        function: "determine_activity_level"
        config:
          high_threshold: 50
          medium_threshold: 10
          low_threshold: 1
    
    target_config:
      table: "analytics.user_activity"
      mode: "upsert"
      conflict_columns: ["user_id"]
    
  # Content Analytics Pipeline
  content_analytics:
    enabled: true
    name: "Content Analytics"
    type: "batch"
    schedule: "0 */2 * * *"  # Every 2 hours
    source: "forum_production"
    target: "forum_analytics"
    
    source_config:
      query: |
        SELECT 
          f.id as content_id,
          f.title,
          f.content,
          f.created_at,
          f.updated_at,
          f.views_count,
          u.username as author_username,
          c.name as category_name,
          COUNT(fc.id) as comments_count,
          COUNT(pv.id) as votes_count,
          AVG(pv.vote_type) as avg_vote_score,
          MAX(fc.created_at) as last_comment_time
        FROM forum_posts f
        JOIN users u ON f.author_id = u.id
        LEFT JOIN categories c ON f.category_id = c.id
        LEFT JOIN forum_comments fc ON f.id = fc.post_id
        LEFT JOIN post_votes pv ON f.id = pv.post_id
        WHERE f.updated_at > :last_run_time
        GROUP BY f.id, f.title, f.content, f.created_at, f.updated_at, 
                 f.views_count, u.username, c.name
        ORDER BY f.updated_at DESC
        LIMIT :batch_size
      incremental_column: "updated_at"
      batch_size: 5000
    
    transformations:
      - name: "calculate_content_quality_score"
        type: "python"
        function: "calculate_content_quality"
        config:
          title_weight: 0.3
          content_weight: 0.4
          engagement_weight: 0.2
          recency_weight: 0.1
      
      - name: "sentiment_analysis"
        type: "ml"
        function: "analyze_sentiment"
        config:
          model_name: "sentiment_v2"
          threshold_positive: 0.6
          threshold_negative: 0.4
    
    target_config:
      table: "analytics.content_analytics"
      mode: "upsert"
      conflict_columns: ["content_id"]
  
  # System Metrics Pipeline
  system_metrics:
    enabled: true
    name: "System Metrics"
    type: "streaming"
    schedule: "*/1 * * * *"  # Every minute
    source: "system_monitoring"
    target: "forum_analytics"
    
    source_config:
      metrics:
        - name: "cpu_usage"
          type: "system"
          collection_method: "psutil"
          interval: 60
        
        - name: "memory_usage"
          type: "system"
          collection_method: "psutil"
          interval: 60
        
        - name: "disk_usage"
          type: "system"
          collection_method: "psutil"
          interval: 300
        
        - name: "network_io"
          type: "system"
          collection_method: "psutil"
          interval: 60
        
        - name: "database_connections"
          type: "database"
          collection_method: "pg_stat_activity"
          interval: 60
        
        - name: "database_queries"
          type: "database"
          collection_method: "pg_stat_statements"
          interval: 60
    
    transformations:
      - name: "normalize_metrics"
        type: "python"
        function: "normalize_system_metrics"
        config:
          cpu_threshold: 80
          memory_threshold: 85
          disk_threshold: 90
    
    target_config:
      table: "analytics.system_metrics"
      mode: "insert"

# Data Quality Configuration
data_quality:
  enabled: true
  validation_rules:
    user_activity:
      - field: "user_id"
        type: "required"
        validator: "integer_positive"
      - field: "engagement_score"
        type: "range"
        validator: "0-100"
      - field: "activity_level"
        type: "enum"
        validator: "high,medium,low,inactive"
    
    content_analytics:
      - field: "content_id"
        type: "required"
        validator: "integer_positive"
      - field: "quality_score"
        type: "range"
        validator: "0-100"
      - field: "sentiment_score"
        type: "range"
        validator: "-1-1"
    
    system_metrics:
      - field: "metric_name"
        type: "required"
        validator: "string_non_empty"
      - field: "metric_value"
        type: "required"
        validator: "numeric"
      - field: "metric_timestamp"
        type: "required"
        validator: "datetime"
  
  quality_thresholds:
    completeness: 0.95
    accuracy: 0.98
    consistency: 0.95
    timeliness: 0.90
    validity: 0.99

# Retention Configuration
retention:
  user_activity:
    raw_data: 365  # days
    aggregated_data: 1095  # 3 years
    archive_after: 90  # days
  
  content_analytics:
    raw_data: 365  # days
    aggregated_data: 1825  # 5 years
    archive_after: 90  # days
  
  system_metrics:
    raw_data: 30  # days
    hourly_aggregated: 365  # days
    daily_aggregated: 1095  # 3 years
    archive_after: 7  # days

# Monitoring Configuration
monitoring:
  enabled: true
  metrics_collection:
    interval: 15  # seconds
    retention_days: 30
    
  alerts:
    pipeline_failure:
      enabled: true
      threshold: 3  # 3 consecutive failures
      notification_channels: ["email", "slack"]
    
    high_latency:
      enabled: true
      threshold: 300  # 5 minutes
      notification_channels: ["email"]
    
    data_quality:
      enabled: true
      threshold: 0.95  # 95% data quality
      notification_channels: ["email", "slack"]
    
    resource_usage:
      enabled: true
      thresholds:
        cpu: 80
        memory: 85
        disk: 90
      notification_channels: ["email"]
  
  dashboards:
    - name: "Analytics Overview"
      description: "Overview of analytics infrastructure"
      panels:
        - title: "Pipeline Status"
          type: "status"
        - title: "Data Quality Score"
          type: "gauge"
        - title: "Processing Rate"
          type: "graph"
        - title: "Resource Usage"
          type: "graph"

# Security Configuration
security:
  encryption:
    enabled: true
    algorithm: "AES-256"
    key_rotation_days: 90
  
  access_control:
    enabled: true
    default_role: "analyst"
    roles:
      - name: "admin"
        permissions: ["read", "write", "delete", "manage"]
      - name: "analyst"
        permissions: ["read", "write"]
      - name: "viewer"
        permissions: ["read"]
  
  audit_logging:
    enabled: true
    log_all_operations: false
    log_sensitive_operations: true
    retention_days: 365

# Backup Configuration
backup:
  enabled: true
  schedule: "0 2 * * *"  # Daily at 2 AM
  retention_days: 30
  compression: true
  encryption: true
  
  destinations:
    - type: "local"
      path: "/opt/analytics/backup"
    - type: "s3"
      bucket: "forum-analytics-backup"
      region: "us-east-1"
  
  backup_types:
    - "database"
    - "configuration"
    - "logs"

# Environment Variables
environment_variables:
  - name: "ANALYTICS_DB_HOST"
    value: "localhost"
  - name: "ANALYTICS_DB_PORT"
    value: "5432"
  - name: "ANALYTICS_DB_NAME"
    value: "forum_analytics"
  - name: "ANALYTICS_DB_USER"
    value: "analytics_user"
  - name: "ANALYTICS_DB_PASSWORD"
    value: "analytics_password"
  - name: "REDIS_HOST"
    value: "localhost"
  - name: "REDIS_PORT"
    value: "6379"
  - name: "LOG_LEVEL"
    value: "INFO"
  - name: "ENVIRONMENT"
    value: "production"
